name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The MAUI phone/desktop app needs extra workloads; CI covers the shared code, web host and desktop host.
      - name: Build
        run: |
          dotnet build src/Hearth.Web -c Release
          dotnet build src/Hearth.Desktop -c Release
      - name: Test
        run: dotnet test tests/Hearth.Core.Tests -c Release --logger "console;verbosity=normal"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t hearth:ci .
